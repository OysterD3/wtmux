name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -count=1 ./...

      - name: Build cross-platform binaries
        run: make release VERSION=${{ github.ref_name }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt

      - name: Bump Homebrew tap formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set — skipping tap bump"
            exit 0
          fi

          DARWIN_ARM64_SHA=$(shasum -a 256 dist/wtmux-${VERSION}-darwin-arm64.tar.gz | awk '{print $1}')
          DARWIN_AMD64_SHA=$(shasum -a 256 dist/wtmux-${VERSION}-darwin-amd64.tar.gz | awk '{print $1}')
          LINUX_ARM64_SHA=$(shasum  -a 256 dist/wtmux-${VERSION}-linux-arm64.tar.gz  | awk '{print $1}')
          LINUX_AMD64_SHA=$(shasum  -a 256 dist/wtmux-${VERSION}-linux-amd64.tar.gz  | awk '{print $1}')

          BASE="https://github.com/OysterD3/wtmux/releases/download/${VERSION}"
          VERSION_NUM=${VERSION#v}

          git clone "https://x-access-token:${GH_TOKEN}@github.com/OysterD3/homebrew-wtmux.git" tap
          mkdir -p tap/Formula

          cat > tap/Formula/wtmux.rb <<EOF
          class Wtmux < Formula
            desc "Coordinated git worktrees across sibling repos for AI coding agents"
            homepage "https://github.com/OysterD3/wtmux"
            version "${VERSION_NUM}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "${BASE}/wtmux-${VERSION}-darwin-arm64.tar.gz"
                sha256 "${DARWIN_ARM64_SHA}"
              else
                url "${BASE}/wtmux-${VERSION}-darwin-amd64.tar.gz"
                sha256 "${DARWIN_AMD64_SHA}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "${BASE}/wtmux-${VERSION}-linux-arm64.tar.gz"
                sha256 "${LINUX_ARM64_SHA}"
              else
                url "${BASE}/wtmux-${VERSION}-linux-amd64.tar.gz"
                sha256 "${LINUX_AMD64_SHA}"
              end
            end

            def install
              bin.install Dir["wtmux-*"].first => "wtmux"
            end

            test do
              system "#{bin}/wtmux", "--version"
            end
          end
          EOF

          cd tap
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/wtmux.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date"
          else
            git commit -m "wtmux ${VERSION}"
            git push
          fi
